name: 🚀 Python Build & Semantic Release

# -----------------------------------------------------------
# DÉCLENCHEURS (TRIGGERS)
# -----------------------------------------------------------
on:
    push:
        # Déclenche le workflow uniquement lors d'un push sur la branche 'main'
        branches:
            - main
    workflow_dispatch: # Permet de démarrer le workflow manuellement

# -----------------------------------------------------------
# DÉFINITION DES JOBS
# -----------------------------------------------------------
jobs:
    ## 🏗️ JOB 1 : Construction Multi-OS (Exécuté en parallèle)
    build:
        name: Build (${{ matrix.os }}) 🐍
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false # Permet aux autres builds de continuer même si l'un échoue
            matrix:
                # Restauration de 'ubuntu-latest' pour une couverture complète des OS
                os: [windows-latest, macos-latest]

        steps:
            - name: ⬇️ Checkout code
              uses: actions/checkout@v4

            - name: 🐍 Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            - name: ⚙️ Installer les dépendances système nécessaires (Linux/wxPython)
              # Exécuté uniquement sur Linux. Ces paquets sont nécessaires pour compiler des GUIs comme wxPython.
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libgtk-3-dev \
                      build-essential \
                      libjpeg-dev \
                      libtiff-dev \
                      libsdl1.2-dev \
                      libnotify-dev \
                      libwebkit2gtk-4.0-dev \
                      freeglut3-dev \
                      libgstreamer-plugins-base1.0-dev \
                      libgstreamer1.0-dev

            - name: 📦 Installer les dépendances (PyInstaller & Projet)
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt 
                  pip install pyinstaller

            - name: 🔨 Construire l'Application (Exécutable)
              # Crée l'exécutable dans le dossier 'dist/' avec un nom unique par OS
              run: |
                  pyinstaller --onefile --noconsole main.py -n "proxima-score-${{ matrix.os }}"

            - name: ⬆️ Télécharger l'Artefact de Construction
              # Sauvegarde l'exécutable. Le nom de l'artefact est utilisé pour le téléchargement futur.
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.os }}-build-artifact
                  path: dist/

    ## 📝 JOB 2 : Publication (Release) - Dépend du succès de TOUS les builds
    release:
        name: Semantic Release & Upload Assets 🏷️
        # S'assure que TOUS les jobs du build doivent réussir avant de continuer
        needs: build
        runs-on: ubuntu-latest

        # Permissions étendues nécessaires pour créer le tag et la release GitHub
        permissions:
            contents: write

        steps:
            - name: ⬇️ Checkout code (avec historique complet)
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Essentiel pour 'python-semantic-release'

            - name: 🐍 Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            # --- Étape 1 : Installation et Détermination de la version ---
            - name: 🏷️ Installer et Calculer la Prochaine Version
              id: semantic
              run: |
                  pip install python-semantic-release

                  # 1. Tente de déterminer la prochaine version et le changelog en mode SANS action (--noop).
                  # Ceci génère le changelog dans un fichier qui sera utilisé pour la release.
                  semantic-release version --noop --tag --commit --changelog release_notes.md

                  # 2. Récupère la version et le statut de publication dans les outputs.
                  current_tag=$(semantic-release print-version --current-tag || echo "0.0.0")
                  new_tag=$(semantic-release print-version --tag)

                  echo "tag=$new_tag" >> $GITHUB_OUTPUT

                  if [ "$current_tag" != "$new_tag" ]; then
                    echo "released=true" >> $GITHUB_OUTPUT
                  else
                    echo "released=false" >> $GITHUB_OUTPUT
                  fi

            # --- Étape 2 : Création du Tag Git et Commit du Changement de Version (si nécessaire) ---
            # S'exécute uniquement si 'semantic-release' a déterminé qu'une nouvelle version est nécessaire.
            - name: 🔖 Créer le Tag Git et Mettre à jour la Version Locale
              if: steps.semantic.outputs.released == 'true'
              uses: python-semantic-release/python-semantic-release@v10.4.1
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  git_committer_name: "github-actions"
                  git_committer_email: "actions@users.noreply.github.com"
                  # Exécute la commande pour créer le tag et commiter le changement de version
              #   release_command: "version"

            # --- Étape 3 : Téléchargement de TOUS les Artefacts ---
            - name: 🔽 Télécharger TOUS les Artefacts de Build
              uses: actions/download-artifact@v4
              with:
                  path: release-assets/ # Les exécutables sont téléchargés dans des sous-dossiers ici

            # --- Étape 4 : Déplacer les exécutables dans le répertoire dist/ ---
            # Le 'publish-action' utilise par défaut le répertoire 'dist/' pour les assets.
            - name: 🚚 Déplacer les exécutables dans le répertoire dist/
              if: steps.semantic.outputs.released == 'true'
              run: |
                  mkdir -p dist # S'assurer que le répertoire dist/ existe
                  # Déplace tous les exécutables (nommés proxima-score-*) depuis les sous-dossiers de l'artefact
                  find release-assets/ -type f -name 'proxima-score-*' -exec mv {} dist/ \;

            # --- Étape 5 : Création de la Release GitHub et Attacher les Exécutables (via publish-action) ---
            # Remplacement de l'action softprops par l'action demandée.
            - name: 🚀 Créer la Release GitHub et Attacher les Exécutables (publish-action)
              if: steps.semantic.outputs.released == 'true'
              uses: python-semantic-release/publish-action@v10.4.1
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  tag: ${{ steps.semantic.outputs.tag }}
                  # Cette action crée la release et attache tous les fichiers du dossier 'dist/'
                  # ainsi que le changelog dans le corps.
