name: 🚀 Python Build & Semantic Release

# -----------------------------------------------------------
# DÉCLENCHEURS
# -----------------------------------------------------------
on:
    push:
        # Déclenche le workflow uniquement lors d'un push sur la branche 'main'
        branches:
            - main
    workflow_dispatch: # Permet de démarrer le workflow manuellement

# -----------------------------------------------------------
# DÉFINITION DES JOBS
# -----------------------------------------------------------
jobs:
    ## 🏗️ JOB 1 : Construction Multi-OS (Exécuté en parallèle)
    build:
        name: Build (${{ matrix.os }}) 🐍
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false # Permet aux autres builds de continuer même si l'un échoue
            matrix:
                # Construit pour les deux systèmes d'exploitation principaux
                os: [windows-latest, macos-latest]

        steps:
            - name: ⬇️ Checkout code
              uses: actions/checkout@v4

            - name: 🐍 Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            - name: ⚙️ Installer les dépendances système nécessaires pour wxPython
              if: runner.os == 'Linux' # Exécuter uniquement sur Linux
              run: |
                  sudo apt-get update
                  # Paquets de développement GTK+ 3 et autres dépendances courantes pour wxWidgets
                  sudo apt-get install -y \
                      libgtk-3-dev \
                      build-essential \
                      libjpeg-dev \
                      libtiff-dev \
                      libsdl1.2-dev \
                      libnotify-dev \
                      libwebkit2gtk-4.0-dev \
                      freeglut3-dev \
                      libgstreamer-plugins-base1.0-dev \
                      libgstreamer1.0-dev

            - name: 📦 Installer les dépendances (PyInstaller & Projet)
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt # Assurez-vous d'avoir ce fichier
                  pip install pyinstaller

            - name: 🔨 Construire l'Application (Exécutable)
              # Crée l'exécutable dans le dossier 'dist/' avec un nom unique par OS
              run: |
                  # Nomme le fichier : project_name-os-executable (ex: proxima-scrore-ubuntu-latest)
                  pyinstaller --onefile --noconsole main.py -n "proxima-scrore-${{ matrix.os }}"

            - name: ⬆️ Télécharger l'Artefact de Construction
              # Sauvegarde l'exécutable dans un artefact nommé par l'OS
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.os }}-build-artifact # Nom unique pour le téléchargement futur
                  path: dist/
                  # RetentionDays: 7 # Optionnel : définir la durée de rétention

    ## 📝 JOB 2 : Publication (Release) - Dépend du succès de TOUS les builds
    release:
        name: Semantic Release & Attach Assets 🏷️
        # S'assure que TOUS les jobs du build doivent réussir avant de continuer
        needs: build
        # Exécuté uniquement sur un OS, car il ne crée qu'UNE SEULE release.
        runs-on: ubuntu-latest

        # Permissions étendues nécessaires pour créer le tag et la release GitHub
        permissions:
            contents: write

        steps:
            - name: ⬇️ Checkout code (avec historique complet)
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Essentiel pour 'python-semantic-release' pour analyser l'historique des commits

            - name: 🐍 Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.x"

            # --- Étape 1 : Téléchargement de TOUS les Artefacts ---
            - name: 🔽 Télécharger TOUS les Artefacts de Build
              # Télécharge tous les artefacts créés par le job 'build' dans le répertoire 'release-assets/'
              uses: actions/download-artifact@v4
              with:
                  path: release-assets/ # Tous les fichiers sont décompressés dans ce dossier

            # --- Étape 1.5 (NOUVEAU) : Déplacer les exécutables ---
            # Ceci est CRUCIAL car actions/download-artifact@v4 crée des sous-dossiers.
            - name: 📁 Déplacer les exécutables à la racine de 'release-assets'
              run: |
                  echo "Déplacement des fichiers pour un chemin d'upload clair..."
                  # Déplace le contenu de tous les sous-dossiers directement dans 'release-assets/'
                  find release-assets/ -mindepth 2 -maxdepth 2 -type f -exec mv {} release-assets/ \;
                  # Nettoyer les sous-dossiers vides (windows-latest-build-artifact, macos-latest-build-artifact)
                  find release-assets/ -mindepth 1 -type d -empty -delete

            # --- Étape 2 : Détermination de la version et Tagging ---
            - name: 🚀 Python Semantic Release (Détermination de version et Création de Tag)
              uses: python-semantic-release/python-semantic-release@v10.4.1
              id: semantic
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  git_committer_name: "github-actions"
                  git_committer_email: "actions@users.noreply.github.com"

            # --- Étape 3 (SUPPRIMÉE : L'étape 'Publish | Upload' n'est pas nécessaire et était redondante) ---

            # --- Étape 4 : Création de la Release GitHub et Attacher les Exécutables (CORRIGÉ) ---
            - name: 📦 Créer la Release GitHub et Attacher les Exécutables
              # Condition: N'exécute que si une nouvelle version a été déterminée par 'semantic-release'
              if: steps.semantic.outputs.version != ''
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: ${{ steps.semantic.outputs.tag }}
                  name: Release ${{ steps.semantic.outputs.version }}
                  body: ${{steps.semantic.outputs.release_notes}} # Utilise le changelog généré
                  # Maintenant, les fichiers sont directement dans 'release-assets/', ce qui est plus sûr.
                  files: release-assets/*
                  draft: false
                  prerelease: false
